<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 410" width="1280" height="410" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect width="1280" height="410" rx="18" fill="#ffffff"/>
<text x="40" y="40" font-size="15" font-weight="600" fill="#0f172a" letter-spacing="0.4">ONE RUN</text>
<text x="118" y="40" font-size="15" fill="#64748b">every step is an event the UI shows and the audit log keeps</text>
<rect x="40" y="64" width="180" height="128" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="40" y="64" width="6" height="128" rx="3" fill="#475569"/>
<text x="60" y="96" font-size="17" font-weight="700" fill="#0f172a">1  Incident</text>
<text x="60" y="124" font-size="13.5" fill="#334155">A webhook fails with</text>
<text x="60" y="144" font-size="13.5" fill="#334155">E11000 on a retried</text>
<text x="60" y="164" font-size="13.5" fill="#334155">delivery</text>
<line x1="223" y1="128.0" x2="241" y2="128.0" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="244" y="64" width="180" height="128" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="244" y="64" width="6" height="128" rx="3" fill="#0E7490"/>
<text x="264" y="96" font-size="17" font-weight="700" fill="#0f172a">2  Recall</text>
<text x="264" y="124" font-size="13.5" fill="#334155">Atlas $vectorSearch,</text>
<text x="264" y="144" font-size="13.5" fill="#334155">team filter inside</text>
<text x="264" y="164" font-size="13.5" fill="#334155">the search</text>
<line x1="427" y1="128.0" x2="445" y2="128.0" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="448" y="64" width="180" height="128" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="448" y="64" width="6" height="128" rx="3" fill="#0E7490"/>
<text x="468" y="96" font-size="17" font-weight="700" fill="#0f172a">3  Check</text>
<text x="468" y="124" font-size="13.5" fill="#334155">Typed conditions,</text>
<text x="468" y="144" font-size="13.5" fill="#334155">checked in code</text>
<text x="468" y="164" font-size="13.5" fill="#334155">before the LLM</text>
<line x1="631" y1="128.0" x2="649" y2="128.0" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="652" y="64" width="180" height="128" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="652" y="64" width="6" height="128" rx="3" fill="#475569"/>
<text x="672" y="96" font-size="17" font-weight="700" fill="#0f172a">4  Fix</text>
<text x="672" y="124" font-size="13.5" fill="#334155">LLM reads the app,</text>
<text x="672" y="144" font-size="13.5" fill="#334155">proposes a patch</text>
<text x="672" y="164" font-size="13.5" fill="#334155">within a budget</text>
<line x1="835" y1="128.0" x2="853" y2="128.0" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="856" y="64" width="180" height="128" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="856" y="64" width="6" height="128" rx="3" fill="#15803d"/>
<text x="876" y="96" font-size="17" font-weight="700" fill="#0f172a">5  Prove</text>
<text x="876" y="124" font-size="13.5" fill="#334155">Trusted tests fail</text>
<text x="876" y="144" font-size="13.5" fill="#334155">before the patch and</text>
<text x="876" y="164" font-size="13.5" fill="#334155">pass after it</text>
<line x1="1039" y1="128.0" x2="1057" y2="128.0" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="1060" y="64" width="180" height="128" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="1060" y="64" width="6" height="128" rx="3" fill="#15803d"/>
<text x="1080" y="96" font-size="17" font-weight="700" fill="#0f172a">6  Remember</text>
<text x="1080" y="124" font-size="13.5" fill="#334155">Atlas $jsonSchema</text>
<text x="1080" y="144" font-size="13.5" fill="#334155">refuses any memory</text>
<text x="1080" y="164" font-size="13.5" fill="#334155">without that proof</text>
<line x1="538.0" y1="64" x2="538.0" y2="58" stroke="#b91c1c" stroke-width="0"/>
<rect x="40" y="270" width="1200" height="120" rx="14" fill="#ecfeff" stroke="#0E7490" stroke-width="1.5"/>
<text x="64" y="306" font-size="17" font-weight="700" fill="#0E7490">Team memory in MongoDB Atlas</text>
<text x="64" y="330" font-size="13.5" fill="#155e75">Only proven fixes live here. The agent never decides governance; the database and the memory service do.</text>
<line x1="1150.0" y1="196" x2="1150.0" y2="266" stroke="#15803d" stroke-width="2" marker-end="url(#a)"/>
<text x="1158.0" y="236.0" font-size="12.5" fill="#15803d">write</text>
<line x1="334.0" y1="266" x2="334.0" y2="196" stroke="#0E7490" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="342.0" y="236.0" font-size="12.5" fill="#0E7490">next incident</text>
<line x1="538.0" y1="196" x2="538.0" y2="228" stroke="#b91c1c" stroke-width="2" marker-end="url(#r)"/>
<text x="546.0" y="218" font-size="12.5" fill="#b91c1c">a condition fails:</text>
<text x="546.0" y="234" font-size="12.5" fill="#b91c1c">not applied, escalate</text>
<rect x="64" y="346" width="144" height="28" rx="14" fill="#ffffff" stroke="#67a9b8"/>
<text x="77" y="365" font-size="13" fill="#0f172a">scoped to one team</text>
<rect x="218" y="346" width="183" height="28" rx="14" fill="#ffffff" stroke="#67a9b8"/>
<text x="231" y="365" font-size="13" fill="#0f172a">expires unless re-proven</text>
<rect x="411" y="346" width="222" height="28" rx="14" fill="#ffffff" stroke="#67a9b8"/>
<text x="424" y="365" font-size="13" fill="#0f172a">corrected with version history</text>
<rect x="644" y="346" width="281" height="28" rx="14" fill="#ffffff" stroke="#67a9b8"/>
<text x="657" y="365" font-size="13" fill="#0f172a">forgotten with a content-free tombstone</text>
<rect x="935" y="346" width="196" height="28" rx="14" fill="#ffffff" stroke="#67a9b8"/>
<text x="948" y="365" font-size="13" fill="#0f172a">every read and use audited</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>