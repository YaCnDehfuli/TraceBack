<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Traceback · Memory with receipts</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, sans-serif; color: #1d232a; }
    body { margin: 0; background: #f6f7f9; }
    header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: #fff; border-bottom: 1px solid #dde1e6; }
    header h1 { font-size: 18px; margin: 0; }
    #identity { margin-left: auto; padding: 6px 12px; border-radius: 999px; border: 1px solid #c5ccd3; font-weight: 600; }
    main { display: grid; grid-template-columns: 3fr 2fr; gap: 20px; padding: 20px; }
    section { background: #fff; border: 1px solid #dde1e6; border-radius: 10px; padding: 16px; min-height: 300px; }
    #timeline li { font-size: 18px; margin: 6px 0; }
    #status { color: #5b6670; font-size: 13px; }
    #voice-panel { position: fixed; right: 20px; bottom: 20px; }
  </style>
</head>
<body>
  <!-- P3 owns this page and app.js. P2 owns memory.js (the memory card). P1 owns voice.js. -->
  <header>
    <h1>Traceback</h1>
    <span id="incident-title">Duplicate webhook crashes payments</span>
    <select id="identity" aria-label="Acting as"></select>
  </header>
  <main>
    <section id="run-panel" aria-label="Run">
      <h2>Run</h2>
      <ol id="timeline"></ol>
      <p id="status">Loading…</p>
    </section>
    <section id="memory-panel" aria-label="Memory"><h2>Memory</h2></section>
  </main>
  <div id="voice-panel"></div>
  <script src="app.js"></script>
  <script src="memory.js"></script>
  <script src="voice.js"></script>
</body>
</html>
